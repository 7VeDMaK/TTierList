<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${card.name}">Card Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/cards.css" rel="stylesheet">
    <link href="/css/card-details.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="card-container">


        <a href="/cards" class="btn btn-outline-light mb-3">← Back to Tier List</a>
        <!-- Верхняя секция -->
        <div class="card-header-section">
            <!-- Картинка -->
            <img th:src="@{|${uploadDir}${card.imageUrl}|}" class="card-image-preview" th:alt="${card.name}"/>

            <!-- Название + Теги -->
            <div class="card-details">
                <h2 th:text="${card.name}"></h2>

                <div class="mb-2">
                <span th:each="tag : ${card.tags}"
                      class="badge bg-secondary me-1"
                      th:text="${tag.getName()}"></span>
                </div>
            </div>


            <!-- Тир -->
            <div class="card-rank-section">
                <span class="badge badge-rank"
                      th:classappend="' rank-' + ${card.rank.name()}"
                      th:text="${card.rank}">
                </span>
            </div>
        </div>

        <!-- Описание -->
        <div class="text-start mb-4">
            <h4>Description</h4>
            <p th:text="${card.description}">No description provided.</p>
        </div>

        <!-- Ссылки -->
        <div class="text-start mb-4">
            <h4>Links</h4>
            <ul>
                <li><a th:href="${card.sourceLink}" target="_blank">Source</a></li>
            </ul>
        </div>

        <!-- Кнопки -->
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/cards/edit/{id}(id=${card.id})}" class="btn btn-primary">Edit</a>

            <!-- Кнопка открытия модального окна -->
            <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#confirmDeleteModal">
                Delete
            </button>
        </div>

        <!-- Modal -->
        <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel"
             aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content" style="background-color: #2c2d33; color: #ffffff;"> <!-- Тёмная тема -->
                    <div class="modal-header">
                        <h5 class="modal-title" id="confirmDeleteModalLabel">Confirm Deletion</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        Are you sure you want to delete this card?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

                        <!-- Вот здесь уже форма, которая отправляется -->
                        <form th:action="@{/cards/delete/{id}(id=${card.id})}" method="post">
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
