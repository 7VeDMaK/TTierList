<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Cards</title>
    <style>
        .tag {
            background-color: #007bff;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-right: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>

<h2>All Cards</h2>
<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Rank</th>
        <th>Image</th>
        <th>Link</th>
        <th>Tags</th> <!-- Новый столбец для тегов -->
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="card : ${cards}">
        <td th:text="${card.name}"></td>
        <td th:text="${card.rank}"></td>
        <td>
            <img th:src="@{|${uploadDir}${card.imageUrl}|}" alt="Card Image" width="100" height="100">
        </td>
        <td>
            <a th:href="${card.sourceLink}" target="_blank" th:text="${card.sourceLink}"></a>
        </td>
        <td>
            <!-- Пилюли с тегами -->
            <span th:each="tag : ${card.tags}" th:text="${tag.name}" class="tag">TagName</span>
        </td>
        <td>
            <a th:href="@{/cards/delete/{id}(id=${card.id})}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<a href="/cards/new">Add New Card</a>

</body>
</html>
