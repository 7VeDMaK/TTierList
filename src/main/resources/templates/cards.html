<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Подключаем внешний CSS файл -->
    <link href="/css/cards.css" rel="stylesheet">
</head>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<body>

<div class="container">
    <div class="card-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>All Cards</h2>

            <div class="d-flex gap-2">
                <a href="/cards/info" class="btn btn-danger">Info mode</a>
                <a href="/tags" class="btn btn-outline-secondary">Add Tag</a>
                <a href="/cards/new" class="btn btn-primary">Add Card</a>
            </div>

        </div>


        <table class="table table-borderless">
            <tbody>
            <tr th:each="rankGroup : ${rankGroups}">
                <td class="rank-cell"
                    th:classappend="' rank-' + ${rankGroup.rank.name()}"
                    th:text="${rankGroup.rank}"></td>
                <td>
                    <div class="card-row">
                        <div class="card-wrapper" th:each="card : ${rankGroup.cards}">
                            <a th:href="@{/cards/{id}(id=${card.id})}">
                                <img th:src="@{|${uploadDir}${card.imageUrl}|}"
                                     class="card-image" alt="image"/>
                            </a>
                            <div class="card-info-popup">
                                <div class="d-flex justify-content-between align-items-center flex-wrap mb-2">
                                <h5 class="mb-1" th:text="${card.name}"></h5>
                                        <span class="custom-pill me-1"
                                              th:text="${card.rank}"
                                              th:classappend="' rank-' + ${card.rank.name()}">
                                        </span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center flex-wrap mb-2">
                                    <div class="d-flex flex-wrap align-items-center">
        <span th:each="tag : ${card.tags}"
              class="badge rounded-pill bg-secondary me-1"
              th:text="${tag.name}">
        </span>
                                    </div>
                                    <span th:text="'#' + ${card.getPosition() + 1} + ' in tier'"></span>


                                </div>




                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
