<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Подключаем внешний CSS файл -->
    <link href="/css/cards.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="card-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>All Cards</h2>

            <div class="d-flex gap-2">
                <a href="/tags" class="btn btn-outline-secondary">Add Tag</a>
                <a href="/cards/new" class="btn btn-primary">Add Card</a>
            </div>
        </div>


        <table class="table table-borderless">
            <tbody>
            <tr th:each="rankGroup : ${rankGroups}">
                <td class="rank-cell"
                    th:classappend="' rank-' + ${rankGroup.rank.name()}"
                    th:text="${rankGroup.rank}"></td>
                <td>
                    <div class="card-row">
                        <div class="card-wrapper" th:each="card : ${rankGroup.cards}">
                            <a th:href="@{/cards/{id}(id=${card.id})}">
                                <img th:src="@{|${uploadDir}${card.imageUrl}|}"
                                     class="card-image" alt="image"/>
                            </a>
                            <div class="card-info-popup">
                                <h5 th:text="${card.name}"></h5>
                                <div class="tags">
                                    <span th:each="tag : ${card.tags}"
                                          class="badge rounded-pill bg-secondary me-1"
                                          th:text="${tag.getName()}">
                                    </span>
                                </div>

                                <p th:text="${card.rank}"></p>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
