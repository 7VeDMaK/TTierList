<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tag Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/cards.css" rel="stylesheet">
    <style>
        .tag-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.5em 0.75em;
            border-radius: 50rem;
            background-color: #6c757d;
            color: white;
            margin: 0.25em;
        }

        .tag-pill button {
            border: none;
            background: none;
            color: white;
            margin-left: 0.5em;
            font-size: 0.85em;
            line-height: 1;
            cursor: pointer;
        }

        .tag-pill button:hover {
            color: #ffc107;
        }

        .tag-section {
            max-width: 600px;
            margin: auto;
        }
    </style>
</head>
<body>

<div class="container mt-5 tag-section">
    <div class="card-container text-center">
        <h2 class="mb-4">Tag Manager</h2>

        <div class="d-flex justify-content-center gap-3 mb-4">
            <a href="/cards" class="btn btn-outline-secondary">← Back to Cards</a>
            <a href="/cards/bulk-edit-tags" class="btn btn-outline-primary">Bulk Edit Tags</a>
            <a href="/cards/new" class="btn btn-primary">Add New Card</a>
        </div>

        <h4>All Tags</h4>
        <div class="d-flex flex-wrap justify-content-center mb-4">
            <div class="tag-pill" th:each="tag : ${tags}">
                <span th:text="${tag.name}"></span>
                <form th:action="@{/tags/delete/{id}(id=${tag.id})}" method="post" style="display:inline;">
                    <button type="submit" title="Delete tag">&times;</button>
                </form>
            </div>
        </div>

        <h4>Add New Tag</h4>
        <form th:action="@{/tags}" th:object="${newTag}" method="post" class="mb-3">
            <div class="input-group">
                <input type="text" th:field="*{name}" class="form-control" placeholder="Enter tag name">
                <button type="submit" class="btn btn-success">Add Tag</button>
            </div>
        </form>

        <p th:if="${error}" class="text-danger" th:text="${error}"></p>
    </div>
</div>

</body>
</html>
