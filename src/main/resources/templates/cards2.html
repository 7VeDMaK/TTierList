<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/cards.css" rel="stylesheet">
</head>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const rows = document.querySelectorAll('.card-row');

        rows.forEach(row => {
            new Sortable(row, {
                animation: 150,
                group: { name: 'cards', pull: true, put: true },
                draggable: '.card-wrapper',
                ghostClass: 'ghost',
                forceFallback: true,
                onStart(evt) {
                    document.body.classList.add('drag-active');
                    evt.item.classList.add('dragging');
                },
                onEnd(evt) {
                    document.body.classList.remove('drag-active');
                    evt.item.classList.remove('dragging');

                    const allRows = document.querySelectorAll('tr');
                    const rankMap = {};

                    allRows.forEach(tr => {
                        const rankCell = tr.querySelector('.rank-cell');
                        const rank = rankCell?.textContent.trim();
                        const row = tr.querySelector('.card-row');
                        if (!rank || !row) return;

                        const cardIds = Array.from(row.querySelectorAll('.card-wrapper')).map(wrapper => {
                            const href = wrapper.querySelector('a').getAttribute('href');
                            return href.split('/').pop();
                        });

                        rankMap[rank] = cardIds;
                    });

                    fetch('/cards/reorder', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({rankMap: rankMap})
                    }).then(res => {
                        if (!res.ok) {
                            alert('Ошибка при обновлении порядка!');
                        }
                    });
                }
            });
        });
    });
</script>

<body>
<div class="container">
    <div class="card-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>All Cards</h2>
            <div class="d-flex gap-2">
                <a href="/cards" class="btn btn-danger">Drag mode</a>
                <a href="/tags" class="btn btn-outline-secondary">Add Tag</a>
                <a href="/cards/new" class="btn btn-primary">Add Card</a>
            </div>

        </div>

        <table class="table table-borderless">
            <tbody>
            <tr th:each="rankGroup : ${rankGroups}">
                <td class="rank-cell"
                    th:classappend="' rank-' + ${rankGroup.rank.name()}"
                    th:text="${rankGroup.rank}"></td>
                <td>
                    <div class="card-row">
                        <div class="card-wrapper" th:each="card : ${rankGroup.cards}">
                            <a th:href="@{/cards/{id}(id=${card.id})}">
                                <img th:src="@{|${uploadDir}${card.imageUrl}|}" class="card-image" alt="image"/>
                            </a>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
