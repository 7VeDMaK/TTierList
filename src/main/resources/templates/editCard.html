<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Card</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/common.css" rel="stylesheet">
</head>
<body style="background-color: #23242a; color: #f8f9fa;">

<div class="container py-5">
    <div class="card bg-secondary p-4 rounded shadow-lg">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Edit Card</h2>
            <div>
                <a href="/cards" class="btn btn-outline-light">Back to Cards</a>
            </div>
        </div>

        <form th:action="@{/cards/edit/{id}(id=${card.id})}" th:object="${card}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input type="text" th:field="*{name}" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="rank" class="form-label">Rank:</label>
                <select th:field="*{rank}" id="rank" class="form-select">
                    <option value="SSS">SSS</option>
                    <option value="AAA">AAA</option>
                    <option value="BBBP">BBBP</option>
                    <option value="BBBN">BBBN</option>
                    <option value="CC">CC</option>
                    <option value="DD">DD</option>
                    <option value="FFF">FFF</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="sourceLink" class="form-label">Source Link:</label>
                <input type="text" th:field="*{sourceLink}" id="sourceLink" class="form-control">
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description:</label>
                <textarea th:field="*{description}" id="description" class="form-control" rows="5"></textarea>
            </div>

            <div class="mb-3">
                <label for="imageFile" class="form-label">Image File:</label>
                <input type="file" id="imageFile" name="imageFile" class="form-control">
            </div>

            <div class="mb-4">
                <label class="form-label">Tags:</label>
                <details class="bg-dark p-3 rounded">
                    <summary class="mb-2 text-light">Select Tags</summary>
                    <div class="row">
                        <div class="col-6 col-md-4" th:each="tag : ${tags}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="tagIds"
                                       th:value="${tag.id}" th:checked="${card.tags.contains(tag)}" id="tag-${tag.id}">
                                <label class="form-check-label text-light" th:for="|tag-${tag.id}|" th:text="${tag.name}"></label>
                            </div>
                        </div>
                    </div>
                </details>
            </div>

            <div class="text-end">
                <button type="submit" class="btn btn-primary">Update Card</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
