<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Card</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/cards.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5">
    <div class="card-container mx-auto" style="max-width: 700px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Edit Card</h2>
            <a href="/cards" class="btn btn-outline-secondary btn-sm">← Back</a>
        </div>

        <form th:action="@{/cards/edit/{id}(id=${card.id})}" th:object="${card}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input type="text" th:field="*{name}" id="name"
                       class="form-control bg-dark text-light border-secondary" required>
            </div>

            <div class="mb-3">
                <label for="rank" class="form-label">Rank:</label>
                <select th:field="*{rank}" id="rank"
                        class="form-select bg-dark text-light border-secondary">
                    <option value="SSS">SSS</option>
                    <option value="AAA">AAA</option>
                    <option value="BBBP">BBBP</option>
                    <option value="BBBN">BBBN</option>
                    <option value="CC">CC</option>
                    <option value="DD">DD</option>
                    <option value="FFF">FFF</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="sourceLink" class="form-label">Source Link:</label>
                <input type="text" th:field="*{sourceLink}" id="sourceLink"
                       class="form-control bg-dark text-light border-secondary">
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description:</label>
                <textarea th:field="*{description}" id="description"
                          class="form-control bg-dark text-light border-secondary" rows="5"></textarea>
            </div>

            <div class="mb-3">
                <label for="imageFile" class="form-label">Image File:</label>
                <input type="file" id="imageFile" name="imageFile"
                       class="form-control bg-dark text-light border-secondary">
            </div>

            <div class="mb-4">
                <label class="form-label">Tags:</label>
                <details class="bg-dark border border-secondary text-light p-3 rounded">
                    <summary class="mb-2">Select Tags</summary>
                    <div class="row">
                        <div class="col-6 col-md-4" th:each="tag : ${tags}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="tagIds"
                                       th:value="${tag.id}" th:checked="${card.tags.contains(tag)}" id="tag-${tag.id}">
                                <label class="form-check-label" th:for="|tag-${tag.id}|" th:text="${tag.name}"></label>
                            </div>
                        </div>
                    </div>
                </details>
            </div>

            <div class="text-end">
                <button type="submit" class="btn btn-success">Update Card</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
