<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bulk Tag Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/cards.css" rel="stylesheet">
    <style>
        .card-edit {
            border: 1px solid #46493b;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            background-color: #2c2d33;
        }
        .tag-checklist {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
    </style>
</head>
<body class="bg-dark text-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Bulk Tag Editor</h2>
        <a href="/cards" class="btn btn-outline-secondary btn-sm">← Back</a>
    </div>

    <form th:action="@{/cards/bulk-update-tags}" method="post">
        <div th:each="card : ${cards}" class="card-edit">
            <h5 th:text="${card.name}"></h5>
            <input type="hidden" th:name="cardIds" th:value="${card.id}"/>
            <div class="tag-checklist">
                <div th:each="tag : ${tags}" class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox"
                           th:id="|tag-${card.id}-${tag.id}|"
                           name="tagPairs"
                           th:value="|${card.id}]${tag.id}|"
                           th:checked="${card.tags.contains(tag)}">

                    <label class="form-check-label" th:for="|tag-${card.id}-${tag.id}|"
                           th:text="${tag.name}"></label>
                </div>
            </div>
        </div>
        <div class="text-end">
            <button type="submit" class="btn btn-success">Save All</button>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
